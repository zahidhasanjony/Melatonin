name: Render 3D Short v2 (QA Sheet + Whisper + SwANGLE)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: qa_sheet (fast ~90s 12-frame grid), still (1 frame), or full_video'
        required: true
        type: choice
        default: 'qa_sheet'
        options:
          - qa_sheet
          - still
          - full_video
      zip_filename:
        description: 'ZIP file uploaded to repo root'
        required: true
        default: 'melatonin-gummy-remotion-v2.zip'
      composition_id:
        description: 'Remotion Composition ID'
        required: true
        default: 'MelatoninGummyShort'
      output_filename:
        description: 'Output MP4/PNG filename (used for full_video or still mode)'
        required: true
        default: 'melatonin-gummy-3d-v2.mp4'
      scale:
        description: 'Render scale (1 = 1080x1920, 0.6667 = 720x1280 faster)'
        required: false
        default: '0.6667'
      frame_number:
        description: 'Frame number (only used when mode=still)'
        required: false
        default: '45'

jobs:
  render:
    name: Extract ZIP, Align Voiceover & Render
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Chromium, FFmpeg, Unzip, Software GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            ffmpeg \
            fonts-noto-core \
            libgl1-mesa-dri \
            libegl1 \
            libgles2 \
            libatk1.0-0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgbm1 \
            libgdk-pixbuf-2.0-0 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            libasound2t64
          pip install --quiet pillow faster-whisper

      - name: Extract Uploaded ZIP & Configure SwANGLE
        id: unpack
        run: |
          ZIP_FILE="${{ github.event.inputs.zip_filename }}"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repo root."
            ls -la
            exit 1
          fi
          mkdir -p _extracted
          unzip -o "$ZIP_FILE" -d _extracted
          PKG_PATH=$(find _extracted -maxdepth 3 -name "package.json" | head -n 1)
          PROJECT_DIR=$(dirname "$PKG_PATH")
          if [ -f "$PROJECT_DIR/remotion.config.ts" ]; then
            sed -i "s/'angle'/'swangle'/g" "$PROJECT_DIR/remotion.config.ts"
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Node Dependencies & Headless Browser
        working-directory: ${{ steps.unpack.outputs.project_dir }}
        run: |
          npm install
          npx remotion browser ensure

      - name: Zero-Drift Whisper Word Alignment
        working-directory: ${{ steps.unpack.outputs.project_dir }}
        run: |
          if [ -f "audio/align_whisper.py" ] && [ -f "public/voiceover.mp3" ]; then
            python3 audio/align_whisper.py
          fi

      - name: Render 12-Frame QA Contact Sheet (Fast Mode)
        if: github.event.inputs.mode == 'qa_sheet'
        working-directory: ${{ steps.unpack.outputs.project_dir }}
        run: |
          mkdir -p out/qa_stills
          # 12 key frames covering all 5 enclosed 3D sets & major beats
          FRAMES=(45 140 240 540 1080 1240 1820 2120 2700 3290 3560 4420)
          IDX=1
          for F in "${FRAMES[@]}"; do
            TAG=$(printf "%02d_f%04d" "$IDX" "$F")
            npx remotion still src/index.ts "${{ github.event.inputs.composition_id }}" "out/qa_stills/${TAG}.png" \
              --frame="$F" \
              --scale=0.5 \
              --gl=swangle
            IDX=$((IDX + 1))
          done
          python3 scripts/make_qa_sheet.py

      - name: Render Single Still Frame
        if: github.event.inputs.mode == 'still'
        working-directory: ${{ steps.unpack.outputs.project_dir }}
        run: |
          mkdir -p out
          npx remotion still src/index.ts "${{ github.event.inputs.composition_id }}" "out/${{ github.event.inputs.output_filename }}" \
            --frame="${{ github.event.inputs.frame_number }}" \
            --scale="${{ github.event.inputs.scale }}" \
            --gl=swangle

      - name: Build Ducked Audio Mix & Render Full 3D MP4
        if: github.event.inputs.mode == 'full_video'
        working-directory: ${{ steps.unpack.outputs.project_dir }}
        run: |
          mkdir -p out
          python3 audio/generate_score_sfx.py --out out/score_sfx.wav
          ffmpeg -y -i public/voiceover.mp3 -i out/score_sfx.wav \
            -filter_complex "[0:a]aresample=48000,volume=1.0[v];[1:a]volume=0.35[s];[v][s]amix=inputs=2:duration=first:dropout_transition=0[aout]" \
            -map "[aout]" -c:a pcm_s16le out/mix.wav

          npx remotion render src/index.ts "${{ github.event.inputs.composition_id }}" out/video-silent.mp4 \
            --codec=h264 \
            --crf=16 \
            --scale="${{ github.event.inputs.scale }}" \
            --pixel-format=yuv420p \
            --gl=swangle \
            --concurrency=2

          ffmpeg -y -i out/video-silent.mp4 -i out/mix.wav \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 192k -shortest \
            "out/${{ github.event.inputs.output_filename }}"

      - name: Upload QA Sheet Artifact
        if: github.event.inputs.mode == 'qa_sheet'
        uses: actions/upload-artifact@v4
        with:
          name: qa-contact-sheet-v2
          path: ${{ steps.unpack.outputs.project_dir }}/out/qa-contact-sheet.png
          retention-days: 14

      - name: Upload Rendered Video or Still Artifact
        if: github.event.inputs.mode != 'qa_sheet'
        uses: actions/upload-artifact@v4
        with:
          name: melatonin-v2-render
          path: ${{ steps.unpack.outputs.project_dir }}/out/${{ github.event.inputs.output_filename }}
          retention-days: 14
